<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Learning Portal</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mu:#667085;--bd:#e1e4ea;--ac:#2f5bea;--ok:#12805c;--bad:#c23b3b;--lk:#eef0f4}
@media(prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d222b;--tx:#e8eaf0;--mu:#99a1b3;--bd:#2d3441;--ac:#6f93ff;--ok:#4cc29a;--bad:#ef7b7b;--lk:#262c37}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:1000px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:8px;cursor:pointer}
button.p,.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
button.d{color:var(--bad)}button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
textarea{min-height:90px}label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:7px;border-bottom:1px solid var(--bd);white-space:nowrap}
.bar{height:8px;background:var(--lk);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok)}
.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}
.pr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px}
.pr.lock{opacity:.55}.sub{cursor:pointer}
iframe{width:100%;height:480px;border:1px solid var(--bd);border-radius:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(480px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
</style></head><body><div class="w" id="app"><p class="mu">Loading…</p></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
/* ===== PASTE YOUR FIREBASE CONFIG HERE (Firebase console → Project settings → Your apps → Web app) ===== */
const firebaseConfig={
  apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",projectId:"YOUR_PROJECT",
  storageBucket:"YOUR_PROJECT.appspot.com",messagingSenderId:"000000000000",appId:"YOUR_APP_ID"
};
/* ================================================================================================ */
/* Google Cloud → APIs & Services → Credentials → API key (enable "Google Drive API"; restrict to Drive API + your website) */
const DRIVE_API_KEY="YOUR_DRIVE_API_KEY";
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
if(firebaseConfig.apiKey==='YOUR_API_KEY'){$('#app').innerHTML='<div class="card"><h2>Firebase not configured</h2><p>Open index.html and paste your Firebase config at the top of the script.</p></div>';throw 0}
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),fs=firebase.firestore(),TS=()=>firebase.firestore.FieldValue.serverTimestamp();
const secAuth=firebase.initializeApp(firebaseConfig,'sec').auth();
const S={users:[],batches:[],subjects:[],projects:[],subs:[]};
let me=null,tab='students',view={},msg='',needSetup=false,booting=true,settingUp=false,fb='',fe='',unsubs=[];
const em=u=>u.trim().toLowerCase().replace(/\s+/g,'')+'@portal.app';
const dt=t=>(t&&t.toDate?t.toDate():t?new Date(t):new Date()).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const num=v=>parseFloat(String(v).replace(/[,\s₹]/g,''));
const lines=t=>t.split('\n').map(x=>x.trim()).filter(Boolean);
const byId=(c,id)=>S[c].find(x=>x.id===id);
const isAdmin=()=>me&&me.role==='admin',isStaff=()=>me&&me.role!=='student';
const projs=sid=>S.projects.filter(p=>p.subjectId===sid).sort((a,b)=>a.order-b.order);
const passed=(u,p)=>S.subs.some(s=>s.userId===u&&s.projectId===p&&s.passed);
const unlocked=(u,sid,i)=>i===0||passed(u,projs(sid)[i-1].id);
const bname=id=>(byId('batches',id)||{}).name||'—';
const run=async f=>{try{await f()}catch(e){msg=e.message||String(e);render()}};
const toKey=t=>lines(t).map(l=>{const [x,...y]=l.split('=');return{label:x.trim(),value:num(y.join('='))}}).filter(k=>k.label&&!isNaN(k.value));
const keyTxt=k=>(k||[]).map(x=>x.label+' = '+x.value).join('\n');
const gid=u=>{const m=String(u).match(/\/d\/([\w-]+)|[?&]id=([\w-]+)/);return m&&(m[1]||m[2])};
const dview=u=>{if(!gid(u))throw new Error('Not a Google Drive file link: '+u);return 'https://drive.google.com/file/d/'+gid(u)+'/view'};
const dprev=u=>'https://drive.google.com/file/d/'+gid(u)+'/preview';
let pdfReady;
function loadPdf(){return pdfReady||(pdfReady=new Promise((ok,no)=>{const B='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/',s=document.createElement('script');s.src=B+'pdf.min.js';
  s.onload=async()=>{try{const t=await(await fetch(B+'pdf.worker.min.js')).text();pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([t],{type:'text/javascript'}));ok()}catch(e){no(e)}};
  s.onerror=()=>no(new Error('Could not load the PDF reader. Check your internet connection.'));document.head.appendChild(s)}))}
async function pdfLines(url){
  const r=await fetch('https://www.googleapis.com/drive/v3/files/'+gid(url)+'?alt=media&key='+DRIVE_API_KEY);
  if(!r.ok)throw new Error('Cannot read a Google Drive file (error '+r.status+'). It must be a PDF shared as "Anyone with the link → Viewer".');
  await loadPdf();const pdf=await pdfjsLib.getDocument({data:await r.arrayBuffer()}).promise,out=[];
  for(let n=1;n<=pdf.numPages;n++){const tc=await(await pdf.getPage(n)).getTextContent(),
    it=tc.items.filter(i=>i.str.trim()).map(i=>({s:i.str,x:i.transform[4],y:i.transform[5]})).sort((a,b)=>b.y-a.y||a.x-b.x);
    let cur=[],cy=null;const flush=()=>{if(cur.length)out.push(cur.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' '))};
    for(const i of it){if(cy!==null&&Math.abs(i.y-cy)>3){flush();cur=[];cy=null}cur.push(i);if(cy===null)cy=i.y}flush()}
  return out}
const DATE=/\b\d{1,2}[-\/.](?:\d{1,2}|[A-Za-z]{3})[-\/.]\d{2,4}\b/g,AMT=/\d{1,3}(?:,\d{2,3})+(?:\.\d+)?|\d+\.\d+|\d{2,}/g;
function parseLine(t){const c=t.replace(DATE,' '),amts=(c.match(AMT)||[]).map(x=>parseFloat(x.replace(/,/g,''))).filter(x=>!isNaN(x)),
  name=c.replace(AMT,' ').replace(/\b(Dr|Cr)\b/gi,'').replace(/\s+/g,' ').trim();return{name,label:name.toLowerCase().replace(/[^a-z]/g,''),amts}}
function compare(ans,stu){
  const sl=stu.map(parseLine),al=ans.map(parseLine).filter(x=>x.amts.length);
  if(!al.length)throw new Error('The answer key PDF has no readable amounts. Ask your teacher to check it.');
  if(!sl.some(x=>x.amts.length))throw new Error('No readable text found in your PDF. Export the report from Tally as PDF (not a photo or scan).');
  const by=new Map();sl.forEach(x=>{if(x.label){if(!by.has(x.label))by.set(x.label,[]);by.get(x.label).push(x.amts)}});
  const all=sl.flatMap(x=>x.amts),has=(pool,v)=>{const i=pool.findIndex(y=>Math.abs(y-v)<=1);if(i<0)return false;pool.splice(i,1);return true},
    contains=(pool,need)=>{const p=[...pool];return need.every(v=>has(p,v))};
  let ok=0;const mism=[];
  for(const a of al){let good,found=null;
    if(a.label){const c=by.get(a.label);if(c){good=c.some(x=>contains(x,a.amts));found=c[0]}else good=false}else good=contains(all,a.amts);
    if(good)ok++;else mism.push({name:a.name||'Amount line',expected:a.amts,found})}
  return{total:al.length,correct:ok,mism:mism.slice(0,40)}}
function openErrors(){const m=new Map();for(const x of S.subs){const k=x.userId+'|'+x.projectId,g=m.get(k)||{subs:[],ok:false};g.subs.push(x);if(x.passed)g.ok=true;m.set(k,g)}
  return[...m.values()].filter(g=>!g.ok).map(g=>g.subs.sort((a,b)=>(b.at?.seconds??9e9)-(a.at?.seconds??9e9))[0])}
const dlinks=t=>t.split(/[\s,]+/).filter(Boolean).map(dview);
async function mkUser(username,pw){
  if(!/^[a-z0-9._-]+$/i.test(username))throw new Error('Username: letters, numbers . _ - only.');
  if(pw.length<6)throw new Error('Password must be at least 6 characters.');
  const c=await secAuth.createUserWithEmailAndPassword(em(username),pw);await secAuth.signOut();return c.user.uid}
/* ---------- boot / auth ---------- */
fs.doc('meta/setup').get().then(d=>{needSetup=!d.exists;booting=false;render()}).catch(()=>{booting=false;render()});
auth.onAuthStateChanged(async u=>{
  unsubs.forEach(f=>f());unsubs=[];me=null;
  if(u&&!settingUp){const d=await fs.doc('users/'+u.uid).get();
    if(!d.exists){await auth.signOut();msg='This account has no profile or was removed.';return render()}
    await start({id:u.uid,...d.data()})}
  render()});
async function start(p){me=p;view={};tab='students';
  const L=(k,q)=>unsubs.push(q.onSnapshot(s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>{msg=e.message;render()}));
  L('batches',fs.collection('batches'));L('subjects',fs.collection('subjects'));L('projects',fs.collection('projects'));
  if(isStaff()){L('users',fs.collection('users'));L('subs',fs.collection('submissions').orderBy('at','desc'))}
  else L('subs',fs.collection('submissions').where('userId','==',p.id))}
/* ---------- dialog helper ---------- */
const F=(k,l,t='text',v='',o=[])=>({k,l,t,v,o});
function dlg(title,fields,save){
  const d=document.createElement('dialog');
  d.innerHTML=`<form method="dialog"><h2>${esc(title)}</h2>`+fields.map(f=>`<label>${esc(f.l)}</label>`+
    (f.t==='select'?`<select name="${f.k}">${f.o.map(([v,l])=>`<option value="${esc(v)}" ${v===f.v?'selected':''}>${esc(l)}</option>`).join('')}</select>`:
     f.t==='textarea'?`<textarea name="${f.k}">${esc(f.v)}</textarea>`:
     `<input name="${f.k}" type="${f.t}" value="${esc(f.v)}" ${f.t==='file'?'accept="application/pdf"':''}>`)).join('')+
    '<p class="row" style="justify-content:flex-end"><button value="x">Cancel</button><button class="p" value="ok">Save</button></p></form>';
  document.body.appendChild(d);d.showModal();
  d.onclose=()=>{if(d.returnValue==='ok'){const o={};fields.forEach(f=>{const e=d.querySelector(`[name="${f.k}"]`);o[f.k]=f.t==='file'?e.files[0]:e.value.trim()});run(()=>save(o))}d.remove()}}
/* ---------- views ---------- */
function render(){
  const a=$('#app');if(booting)return;
  if(!me){const setup=needSetup;
    return a.innerHTML=`<div class="card" style="max-width:380px;margin:40px auto"><h2>${setup?'First-time setup: create admin':'Log in'}</h2>${msg?`<p class="bad">${esc(msg)}</p>`:''}
    ${setup?'<label>Admin name</label><input id="n">':''}<label>Username</label><input id="u" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password">
    <p><button class="p" data-a="${setup?'setup':'login'}">${setup?'Create admin':'Log in'}</button></p></div>`}
  let h=`<header><h1>Learning Portal</h1><div class="row"><span class="mu">${esc(me.name)} · ${me.role}</span><button data-a="logout">Log out</button></div></header>`;
  if(msg)h+=`<div class="card bad">${esc(msg)} <button data-a="clr">OK</button></div>`;
  a.innerHTML=h+(isStaff()?staffView():studentView())}
const tbl=(heads,rows)=>`<div class="sc"><table><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')}</table></div>`;
const btn=(a,id,l,c='')=>`<button class="${c}" data-a="${a}" data-id="${id}">${l}</button>`;
function staffView(){
  const ec=openErrors().length,banner=ec?`<div class="card bad">⚠ ${ec} student project(s) have errors in their latest submission. <button data-a="showErr">View</button></div>`:'';
  const t=[['students','Students'],['batches','Batches'],['subjects','Subjects & syllabus'],['projects','Projects'],['submissions','Submissions'+(ec?' ⚠'+ec:'')],['progress','Progress']];
  if(isAdmin())t.push(['staff','Teachers & admins']);
  return banner+'<div class="tabs">'+t.map(([k,l])=>`<button class="${tab===k?'on':''}" data-a="tab" data-k="${k}">${l}</button>`).join('')+'</div>'+({students:tStudents,batches:tBatches,subjects:tSubjects,projects:tProjects,submissions:tSubs,progress:tProgress,staff:tStaff}[tab])()}
function tStudents(){const l=S.users.filter(u=>u.role==='student');
  return `<div class="card row"><h2>Students (${l.length})</h2><button class="p" data-a="addStu">+ Add student</button></div><div class="card">`+
  tbl(['Reg. no','Username','Name','Batch','Category','Added',''],l.map(u=>`<tr><td>${esc(u.regno)}</td><td>${esc(u.username)}</td><td>${esc(u.name)}</td><td>${esc(bname(u.batchId))}</td><td>${esc(u.category)}</td><td>${dt(u.createdAt)}</td><td>${btn('editStu',u.id,'Edit')} ${isAdmin()?btn('delUser',u.id,'Delete','d'):''}</td></tr>`))+'</div>'}
function tBatches(){return `<div class="card row"><h2>Batches (${S.batches.length})</h2><button class="p" data-a="addBat">+ Add batch</button></div><div class="card">`+
  tbl(['Batch','Category','Start date','Timing','Trainer','Students','Updated',''],S.batches.map(b=>`<tr><td>${esc(b.name)}</td><td>${esc(b.category)}</td><td>${esc(b.startDate)}</td><td>${esc(b.timing)}</td><td>${esc(b.trainer)}</td><td>${S.users.filter(u=>u.batchId===b.id).length}</td><td>${dt(b.updatedAt)}</td><td>${btn('editBat',b.id,'Edit')} ${isAdmin()?btn('delBat',b.id,'Delete','d'):''}</td></tr>`))+'</div>'}
function tStaff(){const l=S.users.filter(u=>u.role!=='student');
  return `<div class="card row"><h2>Teachers &amp; admins</h2><button class="p" data-a="addStaff">+ Add teacher / admin</button></div><div class="card">`+
  tbl(['Username','Name','Role','Added',''],l.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.name)}</td><td>${u.role}</td><td>${dt(u.createdAt)}</td><td>${btn('editStaff',u.id,'Edit')} ${u.id!==me.id?btn('delUser',u.id,'Delete','d'):''}</td></tr>`))+'</div>'}
const topics=s=>'<ul>'+(s.topics||[]).map(t=>t.startsWith('-')?`<li style="margin-left:18px;list-style:circle">${esc(t.slice(1).trim())}</li>`:`<li><b>${esc(t)}</b></li>`).join('')+'</ul>';
function tSubjects(){return `<div class="card row"><h2>Subjects &amp; syllabus</h2><button class="p" data-a="addSubj">+ Add subject</button></div>`+
  S.subjects.map(s=>`<div class="card"><div class="row"><h2>${esc(s.name)} <span class="mu">${esc(s.category||'All')} · updated ${dt(s.updatedAt)}</span></h2><div>${btn('editSubj',s.id,'Edit')} ${isAdmin()?btn('delSubj',s.id,'Delete','d'):''}</div></div>${topics(s)}</div>`).join('')}
function tProjects(){return `<div class="card row"><h2>Projects</h2><button class="p" data-a="addProj" ${S.subjects.length?'':'disabled'}>+ Upload project</button></div>`+
  S.subjects.map(s=>{const l=projs(s.id);return l.length?`<div class="card"><h2>${esc(s.name)}</h2>`+l.map(p=>`<div class="pr"><div><b>${p.order}. ${esc(p.title)}</b><div class="mu">${(p.answerUrls||[]).length} answer PDF(s) · <a href="${esc(p.pdfUrl)}" target="_blank" rel="noopener">PDF</a> · updated ${dt(p.updatedAt)}</div></div><div>${btn('editProj',p.id,'Edit')} ${isAdmin()?btn('delProj',p.id,'Delete','d'):''}</div></div>`).join('')+'</div>':''}).join('')}
function tSubs(){let l=S.subs.filter(s=>!fb||s.batchId===fb);if(fe==='err')l=l.filter(s=>!s.passed);
  const lk=s=>(s.files||[]).map((f,i)=>`<a href="${esc(f)}" target="_blank" rel="noopener">PDF ${i+1}</a>`).join(' ');
  return `<div class="card row"><h2>Student submissions (${l.length})</h2><div class="row"><select id="fb" style="width:auto"><option value="">All batches</option>${S.batches.map(b=>`<option value="${b.id}" ${fb===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select><select id="fe" style="width:auto"><option value="">All results</option><option value="err" ${fe==='err'?'selected':''}>Errors only</option></select></div></div><div class="card">`+
  tbl(['Date &amp; time','Reg. no','Student','Batch','Subject','Project','Result','Mismatches','Reports'],l.map(s=>`<tr><td>${dt(s.at)}</td><td>${esc(s.regno)}</td><td>${esc(s.studentName)}</td><td>${esc(bname(s.batchId))}</td><td>${esc(s.subjectName)}</td><td>${esc(s.projectTitle)}</td><td class="${s.passed?'ok':'bad'}">${s.passed?'Passed':'Errors'} (${s.correct}/${s.total})</td><td>${(s.mism||[]).length?`<details><summary>${s.mism.length} mismatch(es)</summary><div style="white-space:normal;min-width:280px">${s.mism.map(m=>esc(m.name)+': expected '+m.expected.join(', ')+(m.found?', student has '+m.found.join(', '):', not found in student PDF')).join('<br>')}</div></details>`:''}</td><td>${lk(s)}</td></tr>`))+'</div>'}
function tProgress(){const st=S.users.filter(u=>u.role==='student');
  return `<div class="card">`+tbl(['Reg. no','Name','Batch',...S.subjects.map(s=>esc(s.name)),'Last submission'],st.map(u=>{
    const last=S.subs.find(s=>s.userId===u.id);
    return `<tr><td>${esc(u.regno)}</td><td>${esc(u.name)}</td><td>${esc(bname(u.batchId))}</td>`+S.subjects.map(s=>{const l=projs(s.id);if(s.category&&s.category!==u.category)return'<td class="mu">–</td>';return`<td>${l.filter(p=>passed(u.id,p.id)).length}/${l.length}</td>`}).join('')+`<td>${last?dt(last.at):'—'}</td></tr>`}))+'</div>'}
function studentView(){
  if(view.p)return projectView();if(view.s)return subjectView();
  const subs=S.subjects.filter(s=>!s.category||s.category===me.category);
  return openErrors().map(x=>`<div class="card bad">⚠ <b>${esc(x.subjectName)} – ${esc(x.projectTitle)}</b>: errors found in your latest submission (${x.mism.length} mismatch). Fix and resubmit. <button data-a="goProj" data-sid="${x.subjectId}" data-id="${x.projectId}">Open</button></div>`).join('')+`<h2>My dashboard</h2><p class="mu">Reg. no ${esc(me.regno)} · ${esc(bname(me.batchId))} · ${esc(me.category)}</p><div class="g">`+
  (subs.map(s=>{const l=projs(s.id),n=l.filter(p=>passed(me.id,p.id)).length,pc=l.length?Math.round(n/l.length*100):0;
   return `<div class="card sub" data-a="openSub" data-id="${s.id}"><b>${esc(s.name)}</b><div class="bar"><i style="width:${pc}%"></i></div><span class="mu">${n} of ${l.length} projects complete (${pc}%)</span></div>`}).join('')||'<p class="mu">No subjects assigned yet.</p>')+'</div>'}
function subjectView(){const s=byId('subjects',view.s),l=projs(s.id);
  return `<p><button data-a="back">← Dashboard</button></p><h2>${esc(s.name)}</h2><div class="card"><b>Syllabus</b>${topics(s)}</div><h2>Projects</h2>`+
  (l.map((p,i)=>{const ok=passed(me.id,p.id),op=unlocked(me.id,s.id,i);
   return `<div class="pr ${op?'':'lock'}"><div><b>${p.order}. ${esc(p.title)}</b><div class="mu ${ok?'ok':''}">${ok?'Completed ✓':op?'Active':'Locked — complete the previous project'}</div></div><button ${op?'':'disabled'} data-a="openProj" data-id="${p.id}">${ok?'Review':'Open'}</button></div>`}).join('')||'<p class="mu">No projects yet.</p>')}
function projectView(){const p=byId('projects',view.p),mine=S.subs.filter(s=>s.projectId===p.id).sort((a,b)=>(b.at?.seconds??9e9)-(a.at?.seconds??9e9)),done=passed(me.id,p.id),last=mine[0];
  const err=!done&&last?`<div class="bad"><p><b>⚠ Errors found: ${last.mism.length} value(s) don’t match the answer key.</b> Correct them in Tally, export the report again and resubmit. Your teacher has been notified.</p><ul>${last.mism.map(m=>`<li>${esc(m.name)} — ${m.found?'your report shows '+m.found.join(', '):'not found in your report'}</li>`).join('')}</ul></div>`:'';
  return `<p><button data-a="openSub" data-id="${p.subjectId}">← Projects</button></p><h2>${esc(p.title)}</h2>
  <div class="card"><iframe src="${esc(dprev(p.pdfUrl))}" title="Project PDF"></iframe><p><a href="${esc(p.pdfUrl)}" target="_blank" rel="noopener">Open in Google Drive</a></p></div>
  <div class="card"><h2>Submit your report</h2>${done?'<p class="ok"><b>Project completed ✓</b> The next project is now active.</p>':err}
  <label>Google Drive link(s) of your report PDF (Day Book, Profit &amp; Loss, Balance Sheet… one per line)</label><textarea id="rep" placeholder="https://drive.google.com/file/d/..."></textarea>
  <p class="mu">Export from Tally as PDF, upload it to your Google Drive, set sharing to “Anyone with the link → Viewer”, then paste the link.</p>
  <p><button class="p" data-a="submit" data-id="${p.id}">Submit &amp; check</button> <span id="sst" class="mu"></span></p></div>
  <div class="card"><h2>My submissions</h2>${mine.length?tbl(['Date &amp; time','Result','Reports'],mine.map(s=>`<tr><td>${dt(s.at)}</td><td class="${s.passed?'ok':'bad'}">${s.passed?'Passed':'Errors'} (${s.correct}/${s.total})</td><td>${(s.files||[]).map((f,i)=>`<a href="${esc(f)}" target="_blank" rel="noopener">PDF ${i+1}</a>`).join(' ')}</td></tr>`)):'<p class="mu">None yet.</p>'}</div>`}
/* ---------- actions ---------- */
const catOpts=()=>[['','—']].concat([...new Set(S.batches.map(b=>b.category).filter(Boolean))].map(c=>[c,c]));
const batchOpts=()=>[['','— none —']].concat(S.batches.map(b=>[b.id,b.name]));
const stuFields=(u={})=>[F('name','Name','text',u.name),F('regno','Reg. no','text',u.regno),F('batchId','Batch','select',u.batchId||'',batchOpts()),F('category','Category (e.g. Accounting)','text',u.category)];
const batFields=(b={})=>[F('name','Batch name','text',b.name),F('category','Category','text',b.category),F('startDate','Start date','date',b.startDate),F('timing','Timing','text',b.timing),F('trainer','Trainer','text',b.trainer),F('notes','Notes','textarea',b.notes)];
const ACT={
  showErr(){tab='submissions';fe='err';render()},goProj(b){view={s:b.dataset.sid,p:b.dataset.id};render()},
  clr(){msg='';render()},tab(b){tab=b.dataset.k;render()},back(){view={};render()},
  openSub(b){view={s:b.dataset.id};render()},openProj(b){view={s:view.s,p:b.dataset.id};render()},
  logout(){auth.signOut()},
  login(){run(async()=>{try{msg='';await auth.signInWithEmailAndPassword(em($('#u').value),$('#p').value)}catch(e){throw new Error('Wrong username or password.')}})},
  setup(){run(async()=>{const u=$('#u').value.trim(),p=$('#p').value;if(!/^[a-z0-9._-]+$/i.test(u)||p.length<6)throw new Error('Enter a username and a password of 6+ characters.');
    settingUp=true;const c=await auth.createUserWithEmailAndPassword(em(u),p),b=fs.batch();
    b.set(fs.doc('users/'+c.user.uid),{role:'admin',username:u,name:$('#n').value.trim()||'Admin',createdAt:TS()});b.set(fs.doc('meta/setup'),{at:TS()});await b.commit();
    needSetup=false;settingUp=false;const d=await fs.doc('users/'+c.user.uid).get();await start({id:c.user.uid,...d.data()});render()})},
  addStu(){dlg('Add student',[F('username','Login username (chosen by you)'),F('password','Password (6+ chars)'),...stuFields()],async o=>{
    const id=await mkUser(o.username,o.password);await fs.doc('users/'+id).set({role:'student',username:o.username,name:o.name,regno:o.regno,batchId:o.batchId,category:o.category,createdAt:TS(),updatedAt:TS()})})},
  editStu(b){const u=byId('users',b.dataset.id);dlg('Edit student ('+u.username+')',stuFields(u),o=>fs.doc('users/'+u.id).update({...o,updatedAt:TS()}))},
  addStaff(){dlg('Add teacher / admin',[F('username','Login username'),F('password','Password (6+ chars)'),F('name','Name'),F('role','Role','select','teacher',[['teacher','Teacher'],['admin','Admin']])],async o=>{
    const id=await mkUser(o.username,o.password);await fs.doc('users/'+id).set({role:o.role,username:o.username,name:o.name,createdAt:TS(),updatedAt:TS()})})},
  editStaff(b){const u=byId('users',b.dataset.id);dlg('Edit '+u.username,[F('name','Name','text',u.name),F('role','Role','select',u.role,[['teacher','Teacher'],['admin','Admin']])],o=>fs.doc('users/'+u.id).update({...o,updatedAt:TS()}))},
  delUser(b){if(confirm('Delete this account? Its login stops working immediately.'))run(()=>fs.doc('users/'+b.dataset.id).delete())},
  addBat(){dlg('Add batch',batFields(),o=>fs.collection('batches').add({...o,createdAt:TS(),updatedAt:TS()}))},
  editBat(b){const x=byId('batches',b.dataset.id);dlg('Edit batch',batFields(x),o=>fs.doc('batches/'+x.id).update({...o,updatedAt:TS()}))},
  delBat(b){if(confirm('Delete batch?'))run(()=>fs.doc('batches/'+b.dataset.id).delete())},
  addSubj(){dlg('Add subject',[F('name','Subject (e.g. Tally)'),F('category','For category (blank = all)'),F('topics','Syllabus — one per line; start sub-topics with "-"','textarea')],o=>fs.collection('subjects').add({name:o.name,category:o.category,topics:lines(o.topics),createdAt:TS(),updatedAt:TS()}))},
  editSubj(b){const s=byId('subjects',b.dataset.id);dlg('Edit subject',[F('name','Subject','text',s.name),F('category','For category','text',s.category),F('topics','Syllabus (one per line; "-" for sub-topics)','textarea',(s.topics||[]).join('\n'))],o=>fs.doc('subjects/'+s.id).update({name:o.name,category:o.category,topics:lines(o.topics),updatedAt:TS()}))},
  delSubj(b){if(confirm('Delete subject?'))run(()=>fs.doc('subjects/'+b.dataset.id).delete())},
  addProj(){dlg('Upload project',[F('subjectId','Subject','select','',S.subjects.map(s=>[s.id,s.name])),F('title','Project title'),F('link','Project PDF — Google Drive link (Anyone with the link → Viewer)'),F('answers','Answer key PDF — Google Drive link(s), one per line (reports exported from Tally as PDF)','textarea')],async o=>{
    const url=dview(o.link),ans=dlinks(o.answers);if(!ans.length)throw new Error('Add the answer key PDF link.');
    await fs.collection('projects').add({subjectId:o.subjectId,title:o.title,pdfUrl:url,answerUrls:ans,order:projs(o.subjectId).length+1,createdAt:TS(),updatedAt:TS()})})},
  editProj(b){const p=byId('projects',b.dataset.id);dlg('Edit project',[F('title','Title','text',p.title),F('order','Order (1 = first)','number',p.order),F('link','New project PDF link (blank = keep current)'),F('answers','Answer key PDF link(s), one per line','textarea',(p.answerUrls||[]).join('\n'))],async o=>{
    const d={title:o.title,order:+o.order||p.order,answerUrls:dlinks(o.answers),updatedAt:TS()};if(!d.answerUrls.length)throw new Error('Add the answer key PDF link.');if(o.link)d.pdfUrl=dview(o.link);await fs.doc('projects/'+p.id).update(d)})},
  delProj(b){if(confirm('Delete project?'))run(()=>fs.doc('projects/'+b.dataset.id).delete())},
  submit(b){run(async()=>{const p=byId('projects',b.dataset.id),sst=$('#sst');let files;
    try{files=dlinks($('#rep').value)}catch(x){return sst.textContent=x.message}
    if(!files.length)return sst.textContent='Paste at least one Google Drive link.';
    if(!(p.answerUrls||[]).length)throw new Error('The teacher has not added an answer key for this project yet.');
    b.disabled=true;sst.textContent='Reading your report…';let stu=[],ans=[];for(const f of files)stu=stu.concat(await pdfLines(f));
    sst.textContent='Comparing with the answer key…';for(const f of p.answerUrls)ans=ans.concat(await pdfLines(f));
    const c=compare(ans,stu),sj=byId('subjects',p.subjectId);
    await fs.collection('submissions').add({userId:me.id,studentName:me.name,regno:me.regno,batchId:me.batchId||'',subjectId:p.subjectId,subjectName:sj.name,projectId:p.id,projectTitle:p.title,
      files,correct:c.correct,total:c.total,mism:c.mism,passed:c.mism.length===0,at:TS()})})}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&ACT[b.dataset.a])ACT[b.dataset.a](b)});
document.addEventListener('change',e=>{if(e.target.id==='fb'){fb=e.target.value;render()}if(e.target.id==='fe'){fe=e.target.value;render()}});
</script></body></html>
