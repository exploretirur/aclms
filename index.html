  const optsOf=(f,dv)=>f.dep?f.o(dv):f.o;
  const init=f=>f.v||(f.t==='select'?((optsOf(f,f.dep?init(get(f.dep)):'')[0])||[])[0]:'')||'';
  fields.forEach(f=>{if(f.t==='pairs')f.opts=f.o(init(get(f.dep)))});
  const multi=f=>f.t==='list'||f.t==='pairs'||f.t==='topics'||f.t==='entries';
  const d=document.createElement('dialog');
  d.innerHTML=`<form method="dialog"><h2>${esc(title)}</h2>`+fields.map(f=>`<label>${esc(f.l)}</label>`+
    (f.t==='select'?`<select name="${f.k}">${optsOf(f,f.dep?init(get(f.dep)):'').map(([v,l])=>`<option value="${esc(v)}" ${v===f.v?'selected':''}>${esc(l)}</option>`).join('')}</select>`:
     f.t==='textarea'?`<textarea name="${f.k}">${esc(f.v)}</textarea>`:
     multi(f)?`<div data-k="${f.k}">${(f.v&&f.v.length?f.v:[f.t==='list'?'':undefined]).map(x=>rowHTML(f,x)).join('')}</div><button type="button" class="addrow" data-k="${f.k}">${esc(f.btn||'+ Add')}</button>${f.t==='entries'?` <button type="button" class="xtr" data-k="${f.k}">📄 Fill from question PDF</button><div class="mu" data-xs="${f.k}"></div>`:''}`:
     `<input name="${f.k}" type="${f.t}" value="${esc(f.v)}">`)).join('')+
    '<p class="row" style="justify-content:flex-start;flex-direction:row-reverse"><button class="p" value="ok">Save</button><button value="x">Cancel</button></p></form>';
  document.body.appendChild(d);d.showModal();
  d.addEventListener('click',e=>{const xb=e.target.closest('.xtr');if(xb)return fillEntries(xb,d,get);const sb=e.target.closest('.addsub');if(sb){sb.previousElementSibling.insertAdjacentHTML('beforeend','<input class="sp" style="margin-top:6px" placeholder="Sub-topic (if any)">');return}
    const b=e.target.closest('.addrow');if(!b)return;const f=get(b.dataset.k);d.querySelector(`div[data-k="${f.k}"]`).insertAdjacentHTML('beforeend',rowHTML(f))});
  fields.forEach(df=>{const sel=d.querySelector(`select[name="${df.k}"]`),kids=fields.filter(f=>f.dep===df.k);if(!sel||!kids.length)return;
    sel.onchange=()=>kids.forEach(f=>{if(f.t==='pairs'){f.opts=f.o(sel.value);d.querySelectorAll(`div[data-k="${f.k}"] .pc`).forEach(x=>{const cur=x.value;x.innerHTML=f.opts.map(o=>`<option ${o===cur?'selected':''}>${esc(o)}</option>`).join('')})}
      else d.querySelector(`select[name="${f.k}"]`).innerHTML=f.o(sel.value).map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('')})});
  d.onclose=()=>{if(d.returnValue==='ok'){const o={};fields.forEach(f=>{
    if(f.t==='list')o[f.k]=[...d.querySelectorAll(`div[data-k="${f.k}"] .li`)].map(i=>i.value.trim()).filter(Boolean);
    else if(f.t==='entries')o[f.k]=[...d.querySelectorAll(`div[data-k="${f.k}"] .er`)].map(x=>({date:x.querySelector('.ed').value,type:x.querySelector('.et').value,amount:parseFloat(x.querySelector('.ea').value)||0,text:x.querySelector('.ex').value.trim()})).filter(x=>x.text);
    else if(f.t==='topics'){o[f.k]=[];d.querySelectorAll(`div[data-k="${f.k}"] .tb`).forEach(b=>{const t=b.querySelector('.tp').value.trim();if(!t)return;o[f.k].push(t);b.querySelectorAll('.sp').forEach(i=>{const v=i.value.trim();if(v)o[f.k].push('-'+v)})})}
    else if(f.t==='pairs')o[f.k]=[...d.querySelectorAll(`div[data-k="${f.k}"] .pr2`)].map(x=>({cat:x.querySelector('.pc').value,url:x.querySelector('.pu').value.trim()})).filter(x=>x.url);
    else o[f.k]=d.querySelector(`[name="${f.k}"]`).value.trim()});run(()=>save(o))}d.remove()}}

function render(){
  const a=$('#app');if(booting)return;
  if(!me){const setup=needSetup;
    return a.innerHTML=`<div class="card" style="max-width:380px;margin:40px auto"><h2>${setup?'First-time setup: create admin':'Log in'}</h2>${msg?`<p class="bad">${esc(msg)}</p>`:''}
    ${setup?'<label>Admin name</label><input id="n">':''}<label>Username</label><input id="u" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password">
    <p><button class="p" data-a="${setup?'setup':'login'}">${setup?'Create admin':'Log in'}</button></p></div>`}
  let h=`<header><h1>Learning Portal</h1><div class="row"><span class="mu">${esc(me.name)} · ${me.role}</span><button data-a="logout">Log out</button></div></header>`;
  if(msg)h+=`<div class="card bad">${esc(msg)} <button data-a="clr">OK</button></div>`;
  try{a.innerHTML=h+(isStaff()?staffView():studentView())+'<p class="mu" style="text-align:center;margin-top:24px">Portal version 11'+(DESK?' · Desktop app':'')+'</p>';renderGuide()}catch(e){a.innerHTML=h+'<div class="card bad">Display error: '+esc(e.message)+'</div>'}}
const tbl=(heads,rows)=>`<div class="sc"><table><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')}</table></div>`;
const btn=(a,id,l,c='')=>`<button class="${c}" data-a="${a}" data-id="${id}">${l}</button>`;
function staffView(){
  const ec=openErrors().length,banner=ec?`<div class="card bad">⚠ ${ec} student project(s) have errors in their latest submission. <button data-a="showErr">View</button></div>`:'';
  const t=[['students','Students'],['batches','Batches'],['subjects','Subjects & syllabus'],['projects','Projects'],['submissions','Submissions'+(ec?' ⚠'+ec:'')],['progress','Progress']];

  return banner+'<div class="tabs">'+t.map(([k,l])=>`<button class="${tab===k?'on':''}" data-a="tab" data-k="${k}">${l}</button>`).join('')+'</div>'+({students:tStudents,batches:tBatches,subjects:tSubjects,projects:tProjects,submissions:tSubs,progress:tProgress,staff:tStaff}[tab])()}

  tbl(['Batch','Category','Start date','Timing','Trainer','Students','Updated',''],S.batches.map(b=>`<tr><td>${esc(b.name)}</td><td>${esc(b.category)}</td><td>${esc(b.startDate)}</td><td>${esc(b.timing)}</td><td>${esc(b.trainer)}</td><td>${S.users.filter(u=>u.batchId===b.id).length}</td><td>${dt(b.updatedAt)}</td><td>${btn('editBat',b.id,'Edit')} ${isAdmin()?btn('delBat',b.id,'Delete','d'):''}</td></tr>`))+'</div>'}
function tStaff(){const l=S.users.filter(u=>u.role!=='student');

const topics=s=>'<ul>'+(s.topics||[]).map(t=>t.startsWith('-')?`<li style="margin-left:18px;list-style:circle">${esc(t.slice(1).trim())}</li>`:`<li><b>${esc(t)}</b></li>`).join('')+'</ul>';

  S.subjects.map(s=>{const l=projs(s.id);return l.length?`<div class="card"><h2>${esc(s.name)}</h2>`+l.map(p=>`<div class="pr"><div><b>${p.order}. ${esc(p.title)}</b><div class="mu">${esc((p.topic||'General').replace(/^-\s*/,''))} · ${esc(reqCats(p).join(', '))}${(p.entries||[]).length?' · '+p.entries.length+' day entries':''} · <a href="${esc(p.pdfUrl)}" target="_blank" rel="noopener">PDF</a> · updated ${dt(p.updatedAt)}</div></div><div>${btn('editProj',p.id,'Edit')} ${isAdmin()?btn('delProj',p.id,'Delete','d'):''}</div></div>`).join('')+'</div>':''}).join('')}
function tSubs(){let l=S.subs.filter(s=>!fb||s.batchId===fb);if(fe==='err')l=l.filter(s=>!s.passed);
  const lk=s=>(s.files||[]).map((f,i)=>`<a href="${esc(f)}" target="_blank" rel="noopener">${i?'Marked PDF':'PDF'}</a>`).join(' ');
  return `<div class="card row"><h2>Student submissions (${l.length})</h2><div class="row"><select id="fb" style="width:auto"><option value="">All batches</option>${S.batches.map(b=>`<option value="${b.id}" ${fb===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select><select id="fe" style="width:auto"><option value="">All results</option><option value="err" ${fe==='err'?'selected':''}>Errors only</option></select></div></div><div class="card">`+
  tbl(['Date &amp; time','Reg. no','Student','Batch','Subject','Assignment','Category','Result','Mismatches','Reports',...(isAdmin()?['']:[])],l.map(s=>`<tr><td>${dt(s.at)}</td><td>${esc(s.regno)}</td><td>${esc(s.studentName)}</td><td>${esc(bname(s.batchId))}</td><td>${esc(s.subjectName)}</td><td>${esc(s.projectTitle)}</td><td>${esc(s.cat)}</td><td class="${s.passed?'ok':'bad'}">${s.passed?'Passed':'Errors'} (${s.correct}/${s.total})</td><td>${(s.mism||[]).length?`<details><summary>${s.mism.length} mismatch(es)</summary><div style="white-space:normal;min-width:280px">${s.mism.map((m,i)=>(i+1)+'. '+(m.note?esc(m.name):esc(m.name)+': expected '+m.expected.map(fmt).join(', ')+(m.found?', student has <span class="hl">'+m.found.map(fmt).join(', ')+'</span>':', <span class="hl">not found in student PDF</span>'))+(m.hint?'<br><span class="mu">💡 '+esc(m.hint)+'</span>':'')).join('<br>')}</div></details>`:''}</td><td>${lk(s)}</td>${isAdmin()?`<td>${btn('editSubm',s.id,'Edit')} ${btn('delSubm',s.id,'Delete','d')}</td>`:''}</tr>`))+'</div>'}
function tProgress(){const st=S.users.filter(u=>u.role==='student');
  return `<div class="card">`+tbl(['Reg. no','Name','Batch',...S.subjects.map(s=>esc(s.name)),'Last submission'],st.map(u=>{
    const last=S.subs.find(s=>s.userId===u.id);
    return `<tr><td>${esc(u.regno)}</td><td>${esc(u.name)}</td><td>${esc(bname(u.batchId))}</td>`+S.subjects.map(s=>{const l=projs(s.id);if(s.category&&s.category!==u.category)return'<td class="mu">–</td>';return`<td>${l.filter(p=>passed(u.id,p.id)).length}/${l.length}</td>`}).join('')+`<td>${last?dt(last.at):'—'}</td></tr>`}))+'</div>'}
const norm=t=>String(t||'').trim().toLowerCase();
const mySubjects=()=>S.subjects.filter(s=>!s.category||norm(s.category)===norm(me.category));
const isOpen=k=>openSet.has(k);
const nh=(k,label,extra='')=>`<div class="nh" data-a="tg" data-n="${k}">${isOpen(k)?'▾':'▸'} ${label}${extra}</div>`;
function aBtn(p,ps){const i=ps.indexOf(p),ok=passed(me.id,p.id),op=unlocked(me.id,p.subjectId,i),bad=reqCats(p).some(c=>!catPassed(me.id,p.id,c)&&latest(me.id,p.id,c));
  return `<button class="ar ${op?'':'lock'} ${bad?'bad':ok?'ok':''} ${view.p===p.id?'on':''}" ${op?'':'disabled'} data-a="goProj" data-sid="${p.subjectId}" data-id="${p.id}">${ok?'✓':!op?'🔒':bad?'⚠':'▶'} ${p.order}. ${esc(p.title)}</button>`}
const subjActive=s=>{const q=seq(s.id);return !q.length||unlocked(me.id,s.id,projs(s.id).findIndex(x=>x.id===q[0].id))};
function sideTree(subs){
  let h=nh('topics','<b>Topics</b>');if(!isOpen('topics'))return h;
  return h+'<div class="nk">'+subs.map(s=>{const k='s'+s.id,ps=projs(s.id),used=new Set();let c='';
    const sAct=subjActive(s);
    if(isOpen(k)||!sAct){(s.topics||[]).forEach((t,ti)=>{const sub=t.startsWith('-'),mine=ps.filter(p=>p.topic===t),tk='t'+s.id+'_'+ti,act=topicActive(me.id,s,t),dn=mine.length>0&&mine.every(p=>passed(me.id,p.id)),lab=(sub?'↳ ':'')+esc(t.replace(/^-\s*/,''));mine.forEach(p=>used.add(p.id));
        c+=`<div class="nk" style="${sub?'margin-left:28px':''}">`+(act?nh(tk,(dn?'✓ ':'')+lab,` <span class="mu">(${mine.length})</span>`)+(isOpen(tk)?(mine.length?mine.map(p=>aBtn(p,ps)).join(''):'<div class="mu nk">No assignments yet</div>'):''):`<div class="nh lock">${mine.length?'🔒':'○'} ${lab} <span class="mu">(${mine.length})</span></div>`)+'</div>'});
      const rest=ps.filter(p=>!used.has(p.id));if(rest.length)c+='<div class="nk"><div class="mu" style="padding:5px 4px">Other assignments</div>'+rest.map(p=>aBtn(p,ps)).join('')+'</div>'}
    const n=ps.filter(p=>passed(me.id,p.id)).length;
    return sAct?nh(k,'<b>'+esc(s.name)+'</b>',` <span class="mu">${n}/${ps.length}</span>`)+c:`<div class="nh lock">🔒 <b>${esc(s.name)}</b> <span class="mu">${n}/${ps.length} · inactive</span></div>`+c}).join('')+'</div>'}
const donut=pc=>`<svg viewBox="0 0 120 120" width="150" height="150" role="img" aria-label="${pc}% complete"><circle cx="60" cy="60" r="50" fill="none" stroke="var(--lk)" stroke-width="14"/><circle cx="60" cy="60" r="50" fill="none" stroke="var(--ok)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${(pc*3.1416).toFixed(1)} 314.16" transform="rotate(-90 60 60)"/><text x="60" y="67" text-anchor="middle" font-size="22" font-weight="600" fill="currentColor">${pc}%</text></svg>`;
function dashMain(subs){
  if(!subs.length)return `<div class="card"><p>No subjects are available for your account yet.</p><p class="mu">Your category is “${esc(me.category||'none')}”. Ask your teacher to check it matches the subject’s student category.</p></div>`;
  const all=subs.flatMap(s=>projs(s.id)),done=all.filter(p=>passed(me.id,p.id)).length,pc=all.length?Math.round(done/all.length*100):0,
    errs=all.filter(p=>!passed(me.id,p.id)&&reqCats(p).some(c=>!catPassed(me.id,p.id,c)&&latest(me.id,p.id,c))).length;
  return `<h2>My progress</h2><div class="card row" style="justify-content:flex-start;gap:28px">${donut(pc)}<div><div class="mu">Overall completion</div><div style="font-size:30px;font-weight:600">${done} / ${all.length}</div><div class="mu">assignments completed</div>${errs?`<p class="bad"><b>⚠ ${errs} assignment(s) have errors</b></p>`:''}</div></div>
  <div class="card"><b>Progress by subject</b>`+subs.map(s=>{const ps=projs(s.id),n=ps.filter(p=>passed(me.id,p.id)).length,q=ps.length?Math.round(n/ps.length*100):0,cur=ps.find((p,i)=>!passed(me.id,p.id)&&unlocked(me.id,s.id,i));
    return `<div style="margin-top:12px"><div class="row"><span>${esc(s.name)}</span><span class="mu">${n} of ${ps.length} · ${q}%</span></div><div class="bar"><i style="width:${q}%"></i></div>${cur?`<span class="mu">Current: ${esc(cur.title)}</span> <button data-a="goProj" data-sid="${s.id}" data-id="${cur.id}">Continue</button>`:ps.length?(n===ps.length?'<span class="ok">All assignments complete ✓</span>':(()=>{const bl=gseq().find(x=>!passed(me.id,x.id)),bs=bl&&byId('subjects',bl.subjectId);return `<span class="mu">🔒 Locked — complete ${bl?esc((bs?bs.name+' · ':'')+bl.title):'the previous assignment'} first</span>`})()):''}</div>`}).join('')+'</div>'}

  ${done?'<div class="card"><p class="ok"><b>Assignment completed ✓</b> The next assignment is now active.</p></div>':''}
  <h2>Submit your reports</h2>${op&&!eok?'<p class="bad">Finish all the day-by-day entries in the live entry guide first, then upload your reports here.</p>':''}${op?'<p class="mu">Export each report from Tally as a PDF and upload it under its category. Errors are shown in red and your teacher is notified. You can resubmit as many times as needed. The next assignment unlocks when every category is correct.</p>':'<p class="bad">This assignment is inactive. Complete the previous assignment first.</p>'}`+

    ${op&&eok?`<label>Upload your ${esc(c)} PDF</label><input type="file" accept="application/pdf" class="rep" data-ci="${i}">

      await fs.collection('projects').add({subjectId:o.subjectId,topic:o.topic,title:o.title,pdfUrl:url,answers:o.answers,entries:o.entries,order:projs(o.subjectId).length+1,createdAt:TS(),updatedAt:TS()})})},
  editProj(b){const p=byId('projects',b.dataset.id),sj=byId('subjects',p.subjectId)||{},cats=()=>[...new Set([...(sj.cats||[]),...(p.answers||[]).map(a=>a.cat)])];
    dlg('Edit assignment',[{...F('topic','Topic / sub-topic','select',p.topic||'',()=>topicOpts(p.subjectId)),dep:'_'},F('title','Title','text',p.title),F('order','Order (1 = first, unlocks in this order)','number',p.order),F('link','New question PDF link (blank = keep current)'),
      {...F('answers','Answer PDFs by submit category (use + to add more)','pairs',p.answers||[],cats),dep:'_'},
      {...F('entries','Day-by-day entries (one by one in the live entry guide)','entries',p.entries||[]),btn:'+ Add entry',src:()=>p.pdfUrl}],async o=>{
      if(!o.answers.length)throw new Error('Add at least one answer PDF.');o.answers.forEach(a=>a.url=dview(a.url));
      const d={topic:o.topic,title:o.title,order:+o.order||p.order,answers:o.answers,entries:o.entries,updatedAt:TS()};if(o.link)d.pdfUrl=dview(o.link);await fs.doc('projects/'+p.id).update(d)})},
  delProj(b){const id=b.dataset.id,subs=S.subs.filter(x=>x.projectId===id);if(confirm('Delete this assignment and its '+subs.length+' student submission(s) (including PDFs in Drive)?'))run(()=>wipe([fs.doc('projects/'+id),...subs.map(x=>fs.doc('submissions/'+x.id)),...S.prog.filter(x=>x.projectId===id).map(x=>fs.doc('entryProg/'+x.id))],subs))},
  delSubm(b){const x=byId('subs',b.dataset.id);if(confirm('Delete this submission and its PDF in Drive? The student can then upload again.'))run(()=>wipe([fs.doc('submissions/'+x.id)],[x]))},
  editSubm(b){const x=byId('subs',b.dataset.id);dlg('Edit submission — '+x.studentName+' · '+x.cat,[F('res','Result','select',x.passed?'ok':'err',[['ok','Correct (mark as passed)'],['err','Errors (student must resubmit)']]),F('note','Note (optional)','text',x.note||'')],o=>{
    const ok=o.res==='ok';return fs.doc('submissions/'+x.id).update({passed:ok,note:o.note,edited:true,editedAt:TS(),mism:ok?[]:((x.mism||[]).length?x.mism:[{name:'Marked incorrect by admin'+(o.note?': '+o.note:''),expected:[],found:null,note:true}])})})},
  submitCat(b){run(async()=>{const p=byId('projects',b.dataset.id),ci=+b.dataset.ci,c=reqCats(p)[ci],sst=$('#sst'+ci),f=document.querySelector('.rep[data-ci="'+ci+'"]').files[0];
    if(!unlocked(me.id,p.subjectId,projs(p.subjectId).indexOf(p)))throw new Error('This assignment is locked. Complete the previous assignment first.');
    if((p.entries||[]).length&&eDone(me.id,p)<p.entries.length)throw new Error('Finish all the day-by-day entries in the live entry guide first.');
    if(!f)return sst.textContent='Choose your PDF file first.';
    if(!/\.pdf$/i.test(f.name)&&f.type!=='application/pdf')return sst.textContent='Only PDF files are allowed.';
    if(f.size>20*1024*1024)return sst.textContent='File is too large (max 20 MB).';
    b.disabled=true;sst.textContent='Reading your report…';const buf=await f.arrayBuffer(),stu=await pdfFromBuf(buf.slice(0));
    sst.textContent='Comparing with the answer key…';let ans=[];for(const a of p.answers.filter(a=>a.cat===c))ans=ans.concat(await pdfLines(a.url));
    const r=compare(ans,stu),sj=byId('subjects',p.subjectId);let files=[],marked=null;
    if(r.mism.length){try{sst.textContent='Marking the errors in red…';marked=new File([await markPdf(buf.slice(0),r.mism)],'marked.pdf',{type:'application/pdf'})}catch(x){console.warn('mark failed',x)}}
    const mk=p.id+'|'+c;if(markedPdf[mk])URL.revokeObjectURL(markedPdf[mk]);if(marked)markedPdf[mk]=URL.createObjectURL(marked);else delete markedPdf[mk];
    if(UPLOAD_URL.startsWith('http')){sst.textContent='Saving to Google Drive…';const stamp=new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
      const base=[sj.name,p.title,c,stamp].join('_').replace(/[^\w.-]+/g,'_'),who=me.regno+' - '+me.name;files=[await toDrive(f,base+'.pdf',bname(me.batchId),who)];if(marked)files.push(await toDrive(marked,base+'_MARKED.pdf',bname(me.batchId),who))}
    await fs.collection('submissions').add({userId:me.id,studentName:me.name,regno:me.regno,batchId:me.batchId||'',subjectId:p.subjectId,subjectName:sj.name,projectId:p.id,projectTitle:p.title,cat:c,
      files,correct:r.correct,total:r.total,mism:r.mism,passed:r.mism.length===0,at:TS()})})}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&ACT[b.dataset.a])ACT[b.dataset.a](b)});
document.addEventListener('change',e=>{if(e.target.id==='fb'){fb=e.target.value;render()}if(e.target.id==='fe'){fe=e.target.value;render()}});
</script></body></html>
